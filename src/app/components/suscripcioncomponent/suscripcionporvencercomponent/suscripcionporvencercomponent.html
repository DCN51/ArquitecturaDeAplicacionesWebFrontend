<div class="container">
  <h2>Suscripciones por vencer</h2>

  <div class="buscador">
    <mat-form-field>
      <mat-label>Vencen en los próximos (días)</mat-label>
      <input matInput type="number" min="0" [(ngModel)]="dias" (keyup.enter)="consultar()">
    </mat-form-field>
    <button matButton="filled" (click)="consultar()">Consultar</button>
  </div>

  @if (mensaje) {
    <p class="mensaje">{{ mensaje }}</p>
  }

  @if (lista.length > 0) {
    <table mat-table [dataSource]="lista" class="mat-elevation-z2">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let element">{{ element.suscripcionId }}</td>
      </ng-container>

      <ng-container matColumnDef="paciente">
        <th mat-header-cell *matHeaderCellDef>Paciente</th>
        <td mat-cell *matCellDef="let element">{{ element.nombrePaciente }}</td>
      </ng-container>

      <ng-container matColumnDef="plan">
        <th mat-header-cell *matHeaderCellDef>Plan</th>
        <td mat-cell *matCellDef="let element">{{ element.nombrePlan }}</td>
      </ng-container>

      <ng-container matColumnDef="fin">
        <th mat-header-cell *matHeaderCellDef>Vence el</th>
        <td mat-cell *matCellDef="let element">{{ element.fechaFin | date:'dd/MM/yyyy':'UTC' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  }
</div>
