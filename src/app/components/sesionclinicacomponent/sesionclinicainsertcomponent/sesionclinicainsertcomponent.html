<div class="container">
  <h2>Iniciar sesión clínica</h2>

  <form [formGroup]="sesionForm" (ngSubmit)="iniciarSesion()">

    <mat-form-field class="campo">
      <mat-label>Id de usuario (paciente)</mat-label>
      <input matInput type="number" formControlName="usuarioId">
      @if (sesionForm.get('usuarioId')?.hasError('required')) {
        <mat-error>El id de usuario es obligatorio</mat-error>
      }
      @if (sesionForm.get('usuarioId')?.hasError('min')) {
        <mat-error>El id debe ser mayor a 0</mat-error>
      }
    </mat-form-field>

    <div class="botones">
      <button matButton="filled" type="submit">Iniciar</button>
      <button matButton type="button" routerLink="/sesiones/historial">Ver historial</button>
    </div>
  </form>

  @if (mensaje) {
    <p class="mensaje">{{ mensaje }}</p>
  }

  @if (sesionCreada) {
    <button matButton="outlined" [routerLink]="['/sesiones/finalizar', sesionCreada.sesionClinicaId]">
      Finalizar esta sesión
    </button>
  }
</div>
