<div class="container">
  <h2>Iniciar sesión clínica</h2>

  <p class="detalle">Al iniciar, la sesión queda abierta y puedes conversar con la IA hasta finalizarla.</p>

  <div class="botones">
    <button matButton="filled" type="button" (click)="iniciarSesion()" [disabled]="enviando || sesionCreada">Iniciar</button>
    <button matButton type="button" routerLink="/sesiones/historial">Ver historial</button>
  </div>

  @if (mensaje) {
    <p class="mensaje">{{ mensaje }}</p>
  }

  @if (sesionCreada) {
    <div class="botones">
      <button matButton="filled" type="button" [routerLink]="['/sesiones/chat', sesionCreada.sesionClinicaId]">
        Conversar con la IA
      </button>
      <button matButton="outlined" type="button" [routerLink]="['/sesiones/finalizar', sesionCreada.sesionClinicaId]">
        Finalizar esta sesión
      </button>
    </div>
  }
</div>
