<div class="container">
  <h2>Casos por psicólogo</h2>

  @if (cargando) {
    <p>Cargando...</p>
  } @else if (mensaje) {
    <p>{{ mensaje }}</p>
  } @else {
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

      <ng-container matColumnDef="psicologo">
        <th mat-header-cell *matHeaderCellDef>Psicólogo</th>
        <td mat-cell *matCellDef="let element">{{ element.nombrePsicologo }}</td>
      </ng-container>

      <ng-container matColumnDef="cantidad">
        <th mat-header-cell *matHeaderCellDef>Cantidad de casos</th>
        <td mat-cell *matCellDef="let element">{{ element.cantidadCasos }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  }
</div>
