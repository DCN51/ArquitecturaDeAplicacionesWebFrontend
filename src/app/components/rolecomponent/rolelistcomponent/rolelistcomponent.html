<div class="container">
  <h2>Roles del sistema</h2>

  <div class="botones">
    <button matButton="filled" routerLink="/roles/insertar">Registrar rol</button>
  </div>

  @if (mensajeAccion) {
    <p class="mensaje">{{ mensajeAccion }}</p>
  }

  @if (mensaje) {
    <p>{{ mensaje }}</p>
  } @else if (dataSource.length > 0) {
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let element">{{ element.roleId }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let element">{{ nombreRol(element.name) }}</td>
      </ng-container>

      <ng-container matColumnDef="editar">
        <th mat-header-cell *matHeaderCellDef>Editar</th>
        <td mat-cell *matCellDef="let element">
          <button matIconButton [routerLink]="['/roles/editar', element.roleId]" [disabled]="esRolDelSistema(element)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="eliminar">
        <th mat-header-cell *matHeaderCellDef>Eliminar</th>
        <td mat-cell *matCellDef="let element">
          <button matIconButton (click)="eliminarRol(element)" [disabled]="esRolDelSistema(element)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  } @else {
    <p>No hay roles registrados</p>
  }
</div>
