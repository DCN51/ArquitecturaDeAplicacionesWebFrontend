<div class="container">
  <h2>Registrar rol</h2>

  <form [formGroup]="roleForm" (ngSubmit)="registrarRol()">

    <mat-form-field class="campo">
      <mat-label>Nombre del rol</mat-label>
      <input matInput formControlName="nombre" placeholder="Ej: SUPERVISOR">
      <mat-hint>Se guarda en mayúsculas con el prefijo ROLE_</mat-hint>
      @if (roleForm.get('nombre')?.hasError('required')) {
        <mat-error>El nombre es obligatorio</mat-error>
      }
      @if (roleForm.get('nombre')?.hasError('maxlength')) {
        <mat-error>Máximo 25 caracteres</mat-error>
      }
    </mat-form-field>

    <div class="botones">
      <button matButton="filled" type="submit">Registrar</button>
      <button matButton type="button" routerLink="/roles/listar">Volver</button>
    </div>
  </form>

  @if (mensaje) {
    <p class="mensaje">{{ mensaje }}</p>
  }
</div>
